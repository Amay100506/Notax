<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NotifyIQ Shopping Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <span class="brand-icon">🔔</span>
        <span class="brand-name">NotifyIQ</span>
      </div>
      <div id="backend-status" class="status-indicator status-offline">Connecting...</div>
    </header>

    <main class="popup-body">
      <div class="hero-card">
        <div class="hero-title">Shopping Intelligence</div>
        <div class="hero-subtitle">Tracking Amazon, Flipkart & Myntra</div>
        <div class="stats-row">
          <div class="stat-item">
            <span id="active-deals-count" class="stat-val">-</span>
            <span class="stat-lbl">Active Deals</span>
          </div>
          <div class="stat-item">
            <span id="coupons-count" class="stat-val">-</span>
            <span class="stat-lbl">Coupons</span>
          </div>
        </div>
      </div>

      <div class="section-title">🎟️ Active Store Coupons</div>
      <div id="coupons-list" class="coupons-scroll">
        <div class="loading-text">Loading coupons...</div>
      </div>

      <button id="open-dashboard-btn" class="btn-action">
        📊 Open Full AI Dashboard
      </button>

      <div style="margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px;">
        <div style="font-size: 11px; color: #94A3B8; margin-bottom: 4px;">Backend Server (for Mobile / LAN):</div>
        <div style="display: flex; gap: 4px;">
          <input id="backend-url-input" type="text" value="http://127.0.0.1:8000" style="flex: 1; font-size: 11px; background: #0F172A; color: #F8FAFC; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px;">
          <button id="save-backend-url-btn" style="font-size: 11px; background: #6366F1; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">Save</button>
        </div>
      </div>
    </main>

    <footer class="popup-footer">
      <span>100% Local Privacy Guaranteed</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
